<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Авторизация - Surgu Gym</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>

</head>
<body>

    <div class="menu">
        <div class="container flex">
            <div class="mobile-btn">
                <ion-icon name="grid"></ion-icon>
            </div>
            <div class="logo">
                <img src="https://raw.githubusercontent.com/programmercloud/pgc-gym/main/img/logo.png" alt="" />
            </div>
            <ul class="nav">
                <li class="nav-item"><a href="/">Главная</a></li>
                <li class="nav-item"><a href="/#why-us">Особенности</a></li>
                <li class="nav-item"><a href="/#explore">О нас</a></li>
            </ul>
            <a href="#" class="btn">Регистрация</a>
        </div>
    </div>

    <header class="header">
        <div class="container flex">
            <div class="text">
                <h1 class="mb">Авторизация в <br /><span>Surgu Gym</span></h1>
                <p class="mb">Введите свои данные, чтобы получить доступ к своему аккаунту.</p>
            </div>
        </div>
    </header>

    <div class="section" id="login">
    <div class="container flex">
        <div class="form-container">
            <h2 class="primary mb">Регистрация</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="email">Электронная почта</label>
                    <input type="email" id="email" name="email" required />
                    </div>
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <div class="password-container">
                            <input type="password" id="password" name="password" required />
                            <button type="button" class="password-toggle" id="password-toggle">&#x1F441;</button>
                        </div>
                    </div>
                    <button type="submit" class="btn mt">Войти</button>
                </form>
            </div>
        </div>
    </div>



    <footer class="footer">
        <div class="container flex">
            <p class="tertiary">&copy; 2025 проект СурГУ</p>
        </div>
    </footer>
</body>
<script>
document.getElementById('password-toggle').addEventListener('click', function() {
    var passwordInput = document.getElementById('password');
    var icon = document.getElementById('password-toggle');

    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.innerHTML = '&#x1F440;'; // Eye icon open
    } else {
        passwordInput.type = 'password';
        icon.innerHTML = '&#x1F441;'; // Eye icon closed
    }
});

</script>
<style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    background-color: #f8f9fa;
    width: 100%;
    min-height: 100%;
}

.container {
    width: 90%;
    max-width: 1200px;
    margin: auto;
}

.flex {
    display: flex;
    justify-content: center;
    align-items: center;
}

.menu {
    background-color: #343a40;
    padding: 15px 0;
}

.menu .logo img {
    width: 150px;
}

.menu .nav {
    list-style: none;
    display: flex;
}

.menu .nav-item {
    margin: 0 15px;
}

.menu .nav-item a {
    color: #ffffff;
    text-decoration: none;
}

.btn {
    background-color: #007bff;
    color: #ffffff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    text-decoration: none;
}

.header {
    background-color: #e9ecef;
    padding: 50px 0;
    text-align: center;
}

.header .text h1 {
    font-size: 2.5em;
    margin-bottom: 15px;
}

.header .text span {
    color: #007bff;
}

.section {
    padding: 40px 0;
}

.primary {
    color: #007bff;
    font-size: 1.5em;
    margin-bottom: 20px;
}

.form-container {
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 400px;
    margin: auto;
}

.form-group {
    margin-bottom: 15px;
}
.password-container {
    display: flex;
    align-items: center;
    width: 100%;
}

.password-container input {
    flex-grow: 1; 
    padding: 10px 50px 10px 10px;
    border: 1px solid #ced4da;
    border-radius: 5px;
}

.password-toggle {
    background: transparent;
    border: none;
    cursor: pointer;
    outline: none;
    margin-left: -30px; 
    font-size: 1.2em; 
    display: flex; 
    align-items: center; 
}
.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

.form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ced4da;
    border-radius: 5px;
}

.btn.mt {
    background-color: #007bff;
    color: #ffffff;
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    width: 100%;
}

.tertiary {
    color: #6c757d;
}

.footer {
    background-color: #343a40;
    color: #ffffff;
    text-align: center;
    padding: 15px 0;
}

</style>
</body>
</html>
